services:
  postgres:
    # IMPORTANT: use pgvector/pgvector; the official postgres image lacks the extension.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nesis}
      POSTGRES_USER: ${POSTGRES_USER:-nesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nesis}
    ports:
      - "5432:5432"
    volumes:
      # Docker-managed named volume: survives `docker compose down` and avoids
      # permission issues on macOS (bind mounts like ./postgres-data:/... fail
      # with "Operation not permitted" on some setups).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nesis} -d ${POSTGRES_DB:-nesis}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nesis}:${POSTGRES_PASSWORD:-nesis}@postgres:5432/${POSTGRES_DB:-nesis}
      PGVECTOR_URL: postgresql+psycopg://${POSTGRES_USER:-nesis}:${POSTGRES_PASSWORD:-nesis}@postgres:5432/${POSTGRES_DB:-nesis}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
